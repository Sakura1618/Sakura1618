name: build-apk
on:
  push:
    branches: ['chatgpt/android16-fix']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk DeepSeekApiDashboard-v1.1-android16.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeekApiDashboard-v1.1-android16
          path: DeepSeekApiDashboard-v1.1-android16.apk
