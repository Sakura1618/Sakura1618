name: build-apk
on:
  push:
    branches: ['chatgpt/android16-fix']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk DeepSeekApiDashboard-v1.1-android16.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeekApiDashboard-v1.1-android16
          path: DeepSeekApiDashboard-v1.1-android16.apk
